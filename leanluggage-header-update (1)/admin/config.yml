backend:
  name: git-gateway
  branch: main

publish_mode: editorial_workflow

media_folder: "images/uploads"
public_folder: "/images/uploads"

collections:
  - name: "posts"
    label: "Travel Stories"
    folder: "content/posts"
    create: true
    slug: "{{slug}}"
    identifier_field: title
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Location", name: "location", widget: "string", hint: "e.g. Aberdeen, Washington" }
      - { label: "Date", name: "date", widget: "datetime", format: "YYYY-MM-DD" }
      - { label: "Thumbnail", name: "thumbnail", widget: "image", required: false }
      - { label: "Excerpt", name: "excerpt", widget: "text", hint: "One or two sentences shown on the Travel Stories index page" }
      - { label: "Most-viewed TikTok URL", name: "tiktok_url", widget: "string", required: false, hint: "Paste the full TikTok video link — that's it, nothing else needed" }
      - { label: "Body", name: "body", widget: "markdown" }
